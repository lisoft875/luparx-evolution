# Local development profile. Never use these values anywhere shared: the pepper and the MFA key below
# are visible in the repository, which is exactly what a real secret must never be.

spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    clean-disabled: true

logging:
  level:
    cr.luparx: DEBUG
    org.hibernate.SQL: DEBUG

luparx:
  jwt:
    # Si no hay par de llaves en disco, se genera uno en memoria al arrancar y se avisa por log.
    # Cada reinicio invalida los tokens anteriores: aceptable en una laptop, jamás en un entorno real.
    ephemeral-keys-when-missing: ${JWT_EPHEMERAL_KEYS:true}
  security:
    # 32 bytes, Base64: "luparx-dev-only-totp-key-32bytes" — replaced per environment in every
    # deployment that is not a developer laptop. Still configured although no portal enforces MFA
    # (CONTRACT.md v0.3 §1): the TOTP code is dormant, not deleted, and it needs a key the day a
    # deployment puts a portal back on luparx.security.mfa-enforced-portals.
    mfa-encryption-key: ${MFA_TOTP_ENCRYPTION_KEY:bHVwYXJ4LWRldi1vbmx5LXRvdHAta2V5LTMyYnl0ZXM=}
    ip-hash-pepper: ${IP_HASH_PEPPER:luparx-dev-only-ip-pepper}
  dev:
    # Creates the launch municipality (San José), one account per portal, and its parking zones,
    # tariffs and numbered bays on start (DevDataSeeder + DevParkingSeeder), so a fresh database is
    # usable without hand-crafting anything. Idempotent: it does nothing when the rows are already
    # there. The beans only exist under this profile; set to false to keep the database untouched.
    seed-demo-data: ${LUPARX_DEV_SEED_DEMO_DATA:true}
    # How many bays the fixture creates, codes "0001".."NNNN", dealt to the zones in contiguous
    # blocks. Configuration rather than a constant in Java so a developer can seed 50 while debugging
    # a screen and the full set when exercising pagination. Values above 10000 are clamped, with a
    # WARN; the column itself is text and accepts any code a real municipality paints.
    parking-spaces: ${LUPARX_DEV_PARKING_SPACES:5000}
