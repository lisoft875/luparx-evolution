# Local development profile. Never use these values anywhere shared: the pepper and the MFA key below
# are visible in the repository, which is exactly what a real secret must never be.

spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    clean-disabled: true

logging:
  level:
    cr.luparx: DEBUG
    org.hibernate.SQL: DEBUG

luparx:
  security:
    # 32 bytes, Base64: "luparx-dev-only-totp-key-32bytes" — replaced per environment in every
    # deployment that is not a developer laptop.
    mfa-encryption-key: ${MFA_TOTP_ENCRYPTION_KEY:bHVwYXJ4LWRldi1vbmx5LXRvdHAta2V5LTMyYnl0ZXM=}
    ip-hash-pepper: ${IP_HASH_PEPPER:luparx-dev-only-ip-pepper}
