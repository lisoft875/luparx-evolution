# LupaRX backend — base configuration.
#
# Every secret is read from an environment variable with no usable default: the application must fail
# to start rather than run with a placeholder key (docs/SECURITY.md §5). Values under
# `platform.defaults` are DEFAULTS, not assumptions: they only fill in what a request or a tenant did
# not specify, and a deployment in another country changes this file, never the code (CONTRACT.md §7).

spring:
  application:
    name: luparx-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5442/luparx}
    username: ${SPRING_DATASOURCE_USERNAME:luparx}
    password: ${SPRING_DATASOURCE_PASSWORD:luparx_dev_only}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:15}
      minimum-idle: 2
      pool-name: luparx-pool
  jpa:
    # The schema is owned by Flyway. Hibernate never creates or validates it: `citext` and `jsonb`
    # columns are intentionally beyond what the dialect would infer (docs/ARCHITECTURE.md §7).
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1035}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLED:false}
  servlet:
    multipart:
      # Evidence photographs (CONTRACT.md v0.7). Kept just above the domain's own limit
      # (luparx.enforcement.max-evidence-bytes) so an oversized upload is refused by the domain with
      # EVIDENCE_TOO_LARGE — a message a client can act on — instead of by the container with a raw
      # 500. The request cap leaves room for the small text parts that travel beside the file.
      max-file-size: ${EVIDENCE_MAX_FILE_SIZE:12MB}
      max-request-size: ${EVIDENCE_MAX_REQUEST_SIZE:14MB}
  jackson:
    default-property-inclusion: non_null
  messages:
    basename: messages
    encoding: UTF-8
  threads:
    virtual:
      enabled: false

server:
  port: ${SERVER_PORT:8090}
  error:
    # Error bodies are produced by GlobalExceptionHandler as RFC 9457; the servlet default is off.
    whitelabel:
      enabled: false
  forward-headers-strategy: framework
  servlet:
    encoding:
      charset: UTF-8
      force: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true

logging:
  # traceId / tenantId / userId are put in the MDC by RequestCorrelationFilter and
  # TenantContextFilter, so every line of a request can be correlated (docs/ARCHITECTURE.md §6).
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [trace=%X{traceId:--} tenant=%X{tenantId:--} user=%X{userId:--} portal=%X{portal:--}] %logger{36} - %msg%n"
  level:
    root: INFO
    cr.luparx: INFO

platform:
  defaults:
    # Configured defaults of THIS deployment. Not a statement about the only market served.
    country-code: ${PLATFORM_DEFAULT_COUNTRY_CODE:CR}
    currency-code: ${PLATFORM_DEFAULT_CURRENCY_CODE:CRC}
    locale: ${PLATFORM_DEFAULT_LOCALE:es-CR}
    time-zone: ${PLATFORM_DEFAULT_TIME_ZONE:America/Costa_Rica}
    dial-code: ${PLATFORM_DEFAULT_DIAL_CODE:+506}
    minimum-age: ${PLATFORM_DEFAULT_MINIMUM_AGE:18}
    terms-version: ${PLATFORM_TERMS_VERSION:v1}
    # Parking defaults (CONTRACT.md v0.2). They fill in the policy of a municipality that has not
    # configured one yet — and nothing more: the real values live in `parking_policies`, one row per
    # municipality, editable from the admin portal. Nothing in the domain reads this block directly.
    # Lists accept a comma-separated value, so a single environment variable can override one.
    parking:
      # Options offered when starting a session, in minutes.
      session-increments-minutes: ${PARKING_SESSION_INCREMENTS:30,60,120}
      session-min-minutes: ${PARKING_SESSION_MIN_MINUTES:30}
      session-max-minutes: ${PARKING_SESSION_MAX_MINUTES:480}
      extension-enabled: ${PARKING_EXTENSION_ENABLED:true}
      extension-increments-minutes: ${PARKING_EXTENSION_INCREMENTS:15,30,60}
      # Cap on session + every extension. Never below session-max-minutes.
      extension-max-total-minutes: ${PARKING_EXTENSION_MAX_TOTAL_MINUTES:720}
      early-finish-enabled: ${PARKING_EARLY_FINISH_ENABLED:true}
      # Minutes left over come back as CREDIT, never as money (CONTRACT.md v0.2, rule 5).
      credit-on-early-finish-enabled: ${PARKING_CREDIT_ON_EARLY_FINISH_ENABLED:true}
      credit-min-remaining-minutes: ${PARKING_CREDIT_MIN_REMAINING_MINUTES:10}
      # Days a credited minute stays usable; 0 means it never expires.
      credit-expiry-days: ${PARKING_CREDIT_EXPIRY_DAYS:90}
      grace-minutes: ${PARKING_GRACE_MINUTES:5}
      # Minutos de cortesía al inicio (CONTRACT.md v0.31): una estadía que no los pase no se cobra.
      # Cero por omisión: regalar tiempo tiene un costo de ingresos y es una decisión de cada
      # municipalidad, no algo que la plataforma conceda de oficio en nombre de otro. Se otorga UNA
      # vez por placa y día natural, y una zona puede apartarse del número.
      free-minutes: ${PARKING_FREE_MINUTES:0}
      # --- charging hours (CONTRACT.md v0.3) ---
      # Defaults of THIS deployment, applied only to a municipality that has not written its own
      # timetable; the real one lives in `parking_schedules`, one row per municipality. A day left
      # out of the list is a day that is not charged, which is how Sunday ends up free here.
      # Everything is evaluated in the MUNICIPALITY's time zone, never the device's.
      charges-all-day: ${PARKING_CHARGES_ALL_DAY:false}
      charging-weekdays: ${PARKING_CHARGING_WEEKDAYS:MONDAY,TUESDAY,WEDNESDAY,THURSDAY,FRIDAY,SATURDAY}
      charging-starts-at: ${PARKING_CHARGING_STARTS_AT:07:00}
      # 24:00 would mean "until the day ends"; 18:00 is when this deployment's launch municipality closes.
      charging-ends-at: ${PARKING_CHARGING_ENDS_AT:18:00}
      # --- bay code format (CONTRACT.md v0.3) ---
      # Four plain digits, no prefix: the bays San José paints, 0001-5000. A municipality numbering
      # its bays "A-12" or "LUP-0001" edits its own row in `parking_space_formats`.
      space-code-prefix: ${PARKING_SPACE_CODE_PREFIX:}
      space-code-digits: ${PARKING_SPACE_CODE_DIGITS:4}
      space-code-allow-letters: ${PARKING_SPACE_CODE_ALLOW_LETTERS:false}

luparx:
  jwt:
    issuer: ${JWT_ISSUER:https://api.luparx.local}
    key-id: ${JWT_KEY_ID:dev-key-1}
    private-key-path: ${JWT_PRIVATE_KEY_PATH:./infra/secrets/jwt-private-dev.pem}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:./infra/secrets/jwt-public-dev.pem}
    # Retired keys stay published while their tokens expire: "<kid>:<path>" per entry.
    previous-public-key-paths: ${JWT_PREVIOUS_PUBLIC_KEYS:}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    # 0 = the refresh token never expires, so a signed-in citizen stays signed in (CONTRACT.md v0.3
    # §2). It is stored without an `expires_at` and is never refused for being old. What still ends a
    # session is unchanged and deliberate: logging out, changing the password (which bumps
    # `credentials_version` and revokes every token), and an administrator blocking the account.
    # Rotation and reuse detection are untouched — every refresh consumes its token, and a replayed
    # one still revokes the whole family. Set a duration (e.g. 30d) to bring expiry back.
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:0}
    oauth-state-ttl: ${JWT_OAUTH_STATE_TTL:10m}
    # Sólo el perfil dev lo enciende: sin llaves, no se arranca.
    ephemeral-keys-when-missing: ${JWT_EPHEMERAL_KEYS:false}
  security:
    ip-hash-pepper: ${IP_HASH_PEPPER:}
    # RIESGO ACEPTADO POR ESCRITO POR EL PRODUCTO (CONTRACT.md v0.20): no hay segundo factor en
    # ningún portal. El back-office de plataforma administra todas las municipalidades con un correo
    # y una contraseña. Lo que lo compensa hoy es la política de contraseñas, el limitador de
    # intentos respaldado en base de datos y —antes de exponer esto a internet abierto— restringirlo
    # por IP.
    password-min-length: ${PASSWORD_MIN_LENGTH:10}
    login-window: ${LOGIN_ATTEMPT_WINDOW:15m}
    login-max-per-email: ${LOGIN_MAX_FAILURES_PER_EMAIL:5}
    login-max-per-ip: ${LOGIN_MAX_FAILURES_PER_IP:50}
    login-lockout: ${LOGIN_LOCKOUT:15m}
    # Búsqueda de personas en el padrón desde una municipalidad (CONTRACT.md v0.26). Es coincidencia
    # exacta —hay que saber el correo o la cédula completos— y aun así se limita: es la única
    # consulta de un portal de municipalidad que responde por gente de otra. Contratar a diez
    # funcionarios en una tarde cabe de sobra; barrer el padrón, no.
    directory-lookup-window: ${DIRECTORY_LOOKUP_WINDOW:10m}
    directory-lookup-max-per-actor: ${DIRECTORY_LOOKUP_MAX_PER_ACTOR:40}
    cors-allowed-origins:
      # One origin list per portal — never a shared wildcard (docs/SECURITY.md §7).
      citizen: ${CORS_ALLOWED_ORIGIN_CITIZEN:http://localhost:5183}
      admin: ${CORS_ALLOWED_ORIGIN_ADMIN:http://localhost:5184}
      inspector: ${CORS_ALLOWED_ORIGIN_INSPECTOR:http://localhost:5185}
      platform: ${CORS_ALLOWED_ORIGIN_PLATFORM:http://localhost:5186}
  retention:
    # Cuánto se conserva lo que es grande, personal, o las dos cosas (CONTRACT.md v0.29, ADR 0013).
    # Configuración y no constante porque la respuesta legal cambia por país: el plazo en que una
    # municipalidad tiene que poder justificar una boleta no es el mismo en todas partes.
    enabled: ${RETENTION_ENABLED:true}
    # El registro de consultas de fiscalización. Doce meses cubre el plazo en que alguien impugna
    # una boleta y pregunta qué se consultó ese día, sin acumular años de recorridos de cada
    # funcionario.
    enforcement-checks: ${RETENTION_ENFORCEMENT_CHECKS:365d}
    # Por transacción, para no bloquear una tabla en la que los funcionarios están escribiendo ahora.
    batch-size: ${RETENTION_BATCH_SIZE:1000}
    # Techo por corrida: un atraso enorme nunca se convierte en una transacción enorme.
    max-per-run: ${RETENTION_MAX_PER_RUN:100000}
  federation:
    redirect-base-url: ${OAUTH_REDIRECT_BASE_URL:http://localhost:8090}
    providers:
      google:
        client-id: ${OAUTH_GOOGLE_CLIENT_ID:}
        client-secret: ${OAUTH_GOOGLE_CLIENT_SECRET:}
        authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
        token-uri: https://oauth2.googleapis.com/token
        user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
        scopes: openid email profile
      microsoft:
        client-id: ${OAUTH_MICROSOFT_CLIENT_ID:}
        client-secret: ${OAUTH_MICROSOFT_CLIENT_SECRET:}
        authorization-uri: https://login.microsoftonline.com/${OAUTH_MICROSOFT_TENANT_ID:common}/oauth2/v2.0/authorize
        token-uri: https://login.microsoftonline.com/${OAUTH_MICROSOFT_TENANT_ID:common}/oauth2/v2.0/token
        user-info-uri: https://graph.microsoft.com/oidc/userinfo
        scopes: openid email profile
      facebook:
        client-id: ${OAUTH_FACEBOOK_CLIENT_ID:}
        client-secret: ${OAUTH_FACEBOOK_CLIENT_SECRET:}
        authorization-uri: https://www.facebook.com/v19.0/dialog/oauth
        token-uri: https://graph.facebook.com/v19.0/oauth/access_token
        user-info-uri: https://graph.facebook.com/me?fields=id,name,email
        scopes: email public_profile
  mail:
    from-address: ${SMTP_FROM_ADDRESS:no-reply@luparx.local}
    base-urls:
      citizen: ${APP_BASE_URL_CITIZEN:http://localhost:5183}
      admin: ${APP_BASE_URL_ADMIN:http://localhost:5184}
      inspector: ${APP_BASE_URL_INSPECTOR:http://localhost:5185}
      platform: ${APP_BASE_URL_PLATFORM:http://localhost:5186}
  enforcement:
    # Where the development evidence store writes. A directory works for one instance; a deployment
    # that runs more than one must swap the EvidenceStorage bean for an object store, because two
    # backends behind a load balancer do not share a disk (see FilesystemEvidenceStorage).
    evidence-root: ${EVIDENCE_ROOT:./data/evidence}
    # 10 MB: a phone photograph with room to spare. Enforced in the domain, before any storage
    # implementation sees the bytes.
    max-evidence-bytes: ${EVIDENCE_MAX_BYTES:10485760}
    # Verified from each file's own header, never from its name or the type the device declared.
    allowed-image-types: ${EVIDENCE_ALLOWED_TYPES:image/jpeg,image/png,image/webp,image/heic}
    max-photos-per-citation: ${EVIDENCE_MAX_PHOTOS:6}
    max-note-length: ${EVIDENCE_MAX_NOTE_LENGTH:2000}
    # Hard limit for an image a CITIZEN attaches to a defence (CONTRACT.md v0.8). Lower than the
    # officer's: their device is municipal equipment on a known connection, a defence arrives from any
    # phone on any network, and the client is expected to compress — but the client does not decide,
    # this does. How MANY images a defence may carry is the municipality's decision instead, and lives
    # in `enforcement_settings`, editable from the admin portal.
    max-appeal-image-bytes: ${EVIDENCE_MAX_APPEAL_BYTES:1048576}
    # Los documentos de respaldo de un permiso (CONTRACT.md v0.30). Límites propios y no los de la
    # evidencia: un dictamen escaneado son varias páginas y se sube desde un escritorio, mientras que
    # la foto de un parabrisas se toma en la calle con datos móviles.
    max-document-bytes: ${EXEMPTION_MAX_DOCUMENT_BYTES:20971520}
    # Verificados por la cabecera del propio archivo. Un PDF y las imágenes del teléfono; nada que
    # pueda ejecutarse al abrirse (ofimática con macros, ZIP, SVG, HTML).
    allowed-document-types: ${EXEMPTION_ALLOWED_DOCUMENT_TYPES:application/pdf,image/jpeg,image/png,image/webp,image/heic}
    max-documents-per-permit: ${EXEMPTION_MAX_DOCUMENTS:10}
