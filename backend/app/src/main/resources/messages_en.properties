# LupaRX backend — English messages.
#
# CONTRACT.md §7: no user-visible text lives in the code. Every message the API or an email can show
# is resolved from this bundle, in the recipient's locale. Keys are stable identifiers; changing a
# key is a contract change, changing the text is not.
#
# Placeholders are positional: {0} = name, {1} = link, {2} = tenant (see SmtpNotificationSender).

