# LupaRX backend — mensajes en español.
#
# CONTRACT.md §7: ningún texto visible por la persona usuaria vive en el código. Toda la redacción
# está aquí y se resuelve según el locale del destinatario. Las claves son identificadores estables:
# cambiar una clave es un cambio de contrato, cambiar el texto no lo es.
#
# Los marcadores son posicionales: {0} = nombre, {1} = enlace, {2} = municipalidad.

