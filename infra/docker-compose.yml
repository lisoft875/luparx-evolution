
# Entorno de desarrollo local para LupaRX.
# Ninguna contraseña aquí es real: todos los valores por defecto son sólo para desarrollo local
# y deben sobrescribirse vía infra/.env (copiado desde infra/.env.example) en cualquier entorno
# compartido. Nunca usar estos defaults en producción.

services:
  postgres:
    # PostGIS y no postgres a secas desde la v0.40 (ADR 0024): la geometría de las zonas es un tipo
    # geométrico real con índice espacial, no un par de columnas numéricas.
    #
    # El cambio es EN SITIO: esta imagen es el mismo PostgreSQL 16 con la extensión añadida, así que
    # el volumen `luparx_postgres_data` existente se sigue usando tal cual y no hay que recrear la
    # base. Lo único que hace falta es levantar de nuevo el servicio y correr el backend, que aplica
    # la V38_0. Fijá la etiqueta que tenga tu registro si 3.4 no está disponible.
    image: postgis/postgis:16-3.4-alpine
    container_name: luparx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-luparx}
      POSTGRES_USER: ${POSTGRES_USER:-luparx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-luparx_dev_only}
    ports:
      - "${POSTGRES_PORT:-5442}:5432"
    volumes:
      - luparx_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-luparx} -d ${POSTGRES_DB:-luparx}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - luparx

  mailpit:
    image: axllent/mailpit:latest
    container_name: luparx-mailpit
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "${MAILPIT_SMTP_PORT:-1035}:1025" # SMTP para el backend (verificación de email, reset password)
      - "${MAILPIT_UI_PORT:-8035}:8025"   # UI web para leer correos capturados en desarrollo
    networks:
      - luparx

  adminer:
    image: adminer:latest
    container_name: luparx-adminer
    restart: unless-stopped
    profiles:
      - tools # opcional: docker compose --profile tools up
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "${ADMINER_PORT:-8091}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - luparx

networks:
  luparx:
    name: luparx-net

volumes:
  luparx_postgres_data:
    name: luparx_postgres_data
