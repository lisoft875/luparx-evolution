# =================================================================================================
# Un dominio, cuatro portales y la API — LupaRX detrás de nginx.
#
#   /            portal del ciudadano   (el único de cara al público, por eso va en la raíz)
#   /admin/      portal de municipalidad
#   /inspector/  portal de fiscalización
#   /platform/   back-office de plataforma
#   /api/        el backend (las rutas del contrato ya empiezan por /api/v1)
#
# Este archivo NO termina TLS. Se asume un proxy por delante (el que ya sirve los otros sitios de la
# instancia, o el Caddy opcional de infra/docker-compose.deploy.yml) que resuelve el certificado y
# reenvía a este contenedor. Por eso el servicio publica sólo en 127.0.0.1: nada de esto se expone
# directamente a internet.
#
# Lo que NO se enruta es tan deliberado como lo que sí: /actuator, /v3/api-docs y /swagger-ui existen
# en el backend y se quedan dentro de la red de Docker. Métricas y esquema completo de la API son
# reconocimiento gratis para quien busque por dónde entrar, y en esta instalación nadie los necesita
# desde afuera (docs/SECURITY.md §7).
# =================================================================================================

server {
    listen 80;
    server_name _;

    # El proxy de arriba ya registra la IP real; acá interesa el trazo de la petición.
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Documentos de respaldo de un permiso: hasta 20 MB por el dominio
    # (luparx.enforcement.max-document-bytes). Con menos, nginx cortaría la subida con un 413 crudo
    # antes de que el backend pudiera responder el error del contrato.
    client_max_body_size 24m;
    client_body_timeout 60s;

    # No anunciar la versión: no evita un ataque, evita que la instancia aparezca en el barrido de
    # quien busca una versión concreta.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Cabeceras de seguridad para TODO lo que sale de acá. Sin CSP por ahora: ponerla mal rompe la
    # aplicación en silencio y merece su propia pasada con el inventario de orígenes en la mano
    # (queda anotado en docs/SECURITY.md). Ver el archivo incluido: hay que repetir el include en
    # cada `location` que añada una cabecera propia.
    include /etc/nginx/conf.d/security-headers.inc;

    # Sonda del contenedor. No toca el backend a propósito: responde si nginx está vivo, que es lo
    # único que esta sonda debe decir.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- API ---------------------------------------------------------------------------------
    location /api/ {
        # El nombre del backend se resuelve EN CADA PETICIÓN, no al arrancar. Dos razones concretas:
        #
        #   1. Cada despliegue recrea el contenedor del backend con otra IP. Con un bloque `upstream`
        #      —o con un `proxy_pass` literal— nginx resuelve una sola vez al cargar la configuración
        #      y se queda hablándole a una IP que ya no existe hasta que alguien lo reinicia.
        #   2. `nginx -t` puede validar este archivo sin que el backend exista, que es lo que permite
        #      revisar la configuración antes de levantar nada.
        #
        # 127.0.0.11 es el DNS interno de Docker. El costo es perder `keepalive` hacia el backend, que
        # a este volumen no se nota; si algún día se nota, vuelve el bloque `upstream` y con él la
        # necesidad de reiniciar nginx en cada despliegue.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8090;

        # Con un `proxy_pass` que lleva variable, nginx NO reenvía la URI original por su cuenta:
        # hay que pasarla explícitamente. $request_uri incluye la cadena de consulta.
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # El backend arma los enlaces de correo y las URL absolutas con esto
        # (server.forward-headers-strategy=framework). Sin ellas, un enlace de verificación sale
        # apuntando a http://backend:8090.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        # Generosos porque hay endpoints que suben fotografías desde un teléfono en la calle.
        proxy_connect_timeout 5s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        proxy_request_buffering off;
    }

    # --- portales ----------------------------------------------------------------------------
    # Los assets con hash en el nombre son inmutables: un año de caché y ni una revalidación.
    # index.html nunca se cachea, porque es el archivo que nombra la versión nueva de todo lo demás
    # y un index viejo en la caché de un navegador deja al usuario en la versión anterior para
    # siempre.
    location ~* ^/(admin|inspector|platform)/assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/conf.d/security-headers.inc;
        try_files $uri =404;
    }

    # Mismo criterio que el index del ciudadano: el HTML que nombra la versión nunca se cachea.
    # Va como expresión regular porque nginx las evalúa antes que los prefijos, incluso cuando el
    # que llega es el try_files interno del bloque de abajo.
    location ~* ^/(admin|inspector|platform)/index\.html$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/conf.d/security-headers.inc;
        try_files $uri =404;
    }

    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    location /inspector/ {
        alias /usr/share/nginx/html/inspector/;
        try_files $uri $uri/ /inspector/index.html;
    }

    location /platform/ {
        alias /usr/share/nginx/html/platform/;
        try_files $uri $uri/ /platform/index.html;
    }

    # Sin la barra final el navegador pediría /admin y nginx no entraría en el bloque de arriba.
    location = /admin      { return 301 /admin/; }
    location = /inspector  { return 301 /inspector/; }
    location = /platform   { return 301 /platform/; }

    location /assets/ {
        root /usr/share/nginx/html/citizen;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/conf.d/security-headers.inc;
        try_files $uri =404;
    }

    # El ciudadano, en la raíz. Va de último: es el comodín.
    location / {
        root /usr/share/nginx/html/citizen;
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        root /usr/share/nginx/html/citizen;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/conf.d/security-headers.inc;
    }
}
